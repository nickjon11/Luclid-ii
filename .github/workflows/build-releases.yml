name: Build native release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v0.7.*']
permissions:
  contents: write
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        run: python packaging/check_version.py
      - name: Validate tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] == 'v' + Path('VERSION').read_text().strip()
      - name: Install Linux GUI build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1 libegl1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Build native GUI application
        run: python packaging/build_native.py
      - name: Install Windows installer compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build one-time Windows setup EXE
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$version" "packaging\windows_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Create macOS drag-and-drop installer DMG
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dmg-stage
          cp -R dist/Luclid-ii.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Luclid-ii" -srcfolder dmg-stage -ov -format UDZO "Luclid-ii-v$(cat VERSION)-macOS.dmg"
      - name: Build Debian package
        if: matrix.platform == 'linux'
        run: python packaging/linux/build_deb.py
      - name: Package native application
        shell: python
        run: |
          from pathlib import Path
          import shutil
          platform='${{ matrix.platform }}'
          src=Path('dist')
          package = 'Luclid-ii.app' if platform == 'macos' else 'Luclid-ii'
          assert (src/package).exists(), f'Missing {package}'
          shutil.make_archive('luclid-ii-'+platform, 'zip', root_dir=src, base_dir=package)
      - uses: actions/upload-artifact@v4
        with:
          name: luclid-ii-${{ matrix.platform }}
          path: luclid-ii-${{ matrix.platform }}.zip
          if-no-files-found: error
      - name: Upload Windows setup executable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: luclid-ii-windows-setup
          path: release-installers/*.exe
          if-no-files-found: error
      - name: Upload macOS installer disk image
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: luclid-ii-macos-dmg
          path: '*.dmg'
          if-no-files-found: error
      - name: Upload Debian package
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: luclid-ii-deb
          path: '*.deb'
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v0.7.')
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish one release after all platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" || gh release create "${GITHUB_REF_NAME}" --title "Luclid-ii ${GITHUB_REF_NAME}" --notes "Windows, macOS and Linux native builds. Ollama is optional. Unsigned executables may require operating-system approval."
          gh release upload "${GITHUB_REF_NAME}" release-assets/*.zip release-assets/*.deb release-assets/*.exe release-assets/*.dmg --clobber
